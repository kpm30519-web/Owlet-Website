<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C3AA8"/>
      <stop offset="100%" stop-color="#2A1F6E"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="100%" stop-color="#F5C877"/>
    </linearGradient>
    <radialGradient id="eyeShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Wings -->
  <ellipse cx="27" cy="78" rx="12" ry="20" fill="#3A2C8A" transform="rotate(-18 27 78)"/>
  <ellipse cx="101" cy="78" rx="12" ry="20" fill="#3A2C8A" transform="rotate(18 101 78)"/>

  <!-- Ear tufts -->
  <path d="M40 34 L48 16 L58 38 Z" fill="#F5C877"/>
  <path d="M88 34 L80 16 L70 38 Z" fill="#F5C877"/>

  <!-- Head/body -->
  <circle cx="64" cy="66" r="40" fill="url(#body)"/>

  <!-- Belly detail feathers -->
  <path d="M50 92 Q64 100 78 92 Q64 108 50 92 Z" fill="#E9AF5D" opacity="0.6"/>

  <!-- Eye patches -->
  <circle cx="46" cy="60" r="20" fill="#FFFFFF"/>
  <circle cx="82" cy="60" r="20" fill="#FFFFFF"/>

  <!-- Eyes -->
  <circle cx="47" cy="61" r="10.5" fill="#2A1F6E"/>
  <circle cx="81" cy="61" r="10.5" fill="#2A1F6E"/>

  <!-- Eye shine -->
  <circle cx="43.5" cy="57.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="77.5" cy="57.5" r="3.2" fill="#FFFFFF"/>

  <!-- Beak -->
  <path d="M64 68 L57 80 Q64 86 71 80 Z" fill="#E8863E"/>

  <!-- Feet -->
  <path d="M52 104 L48 114 M52 104 L52 115 M52 104 L56 114" stroke="#E8863E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M76 104 L72 114 M76 104 L76 115 M76 104 L80 114" stroke="#E8863E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
